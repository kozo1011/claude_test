# §7.2 メタ発話テンプレートの素材集（ルールベース・ベイカー用）。
# ベイカーはここから人格の distance / verbalTics に応じて決定的にプリベイクする。
# filler / backchannel は読み上げ 1.5 秒以内（§7.3）に収まる長さで書くこと。
backchannel:
  polite:
    - はい
    - ええ
    - なるほどです
    - そうですね
    - 承知しました
    - はい、はい
  casual:
    - うん
    - なるほどね
    - そうだね
    - ふむふむ
    - おっけー
    - うんうん
filler:
  polite:
    - 少々お待ちください
    - 確認いたしますね
    - 調べてみますね
    - 少し考えますね
    - 確認してみます
  casual:
    - ちょっと待ってて
    - 調べてみるね
    - 確認するね
    - ちょっと考える
    - 見てみるね
progress:
  polite:
    - もう少しかかりそうです
    - いま確認を続けています
    - 少し時間がかかっています
    - 整理していますので少々お待ちを
    - まもなくまとまりそうです
  casual:
    - もうちょいかかりそう
    - いま確認してるよ
    - ちょっと手間取ってる
    - もう少しだけ待ってて
    - そろそろまとまりそう
handoff:
  polite:
    - できました、共有しますね
    - お待たせしました
    - 結果が出ました
    - まとまりましたので共有します
    - 確認できました
  casual:
    - できたよ、共有するね
    - お待たせ
    - 結果出たよ
    - まとまったよ
    - 確認できた
apology:
  polite:
    - すみません、失敗しました
    - 申し訳ありません、うまくいきませんでした
    - エラーが起きてしまいました
    - すみません、やり直しますね
    - 処理に失敗してしまいました
  casual:
    - ごめん、失敗した
    - うまくいかなかった
    - エラーが出ちゃった
    - ごめん、やり直すね
    - 処理がこけちゃった
handover:
  polite:
    - "{name}さんに代わりますね"
    - "ここからは{name}さんにお願いします"
    - "{name}さんをお呼びしますね"
    - "{name}さんの方が詳しいと思います"
    - "{name}さんに引き継ぎますね"
  casual:
    - "{name}さんに代わるね"
    - "ここからは{name}さんに任せるよ"
    - "{name}さんを呼ぶね"
    - "{name}さんの方が詳しいよ"
    - "{name}さんにバトンタッチ"
