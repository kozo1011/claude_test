<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Layer コンソール</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --text:#1c222c; --sub:#6b7380; --border:#dfe3e9;
          --human:#dbe7ff; --task:#eef0f3; --meta:#f7f2e3; --accent:#3b6fe0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --panel:#1d2128; --text:#e8eaee; --sub:#98a0ac; --border:#333a45;
            --human:#27395e; --task:#262b33; --meta:#3a3424; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column;
         font-family:"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px;
           background:var(--panel); border-bottom:1px solid var(--border); font-size:14px; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  select,button,input { font:inherit; border-radius:8px; border:1px solid var(--border);
           background:var(--panel); color:var(--text); padding:6px 10px; }
  button { cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:8px 12px; border-radius:12px; line-height:1.6; white-space:pre-wrap; }
  .msg .who { display:block; font-size:11px; color:var(--sub); }
  .human { align-self:flex-end; background:var(--human); }
  .task  { align-self:flex-start; background:var(--task); }
  .meta  { align-self:flex-start; background:var(--meta); font-size:13px; opacity:.9; }
  .sys   { align-self:center; color:var(--sub); font-size:12px; }
  footer { display:flex; gap:8px; padding:10px 14px; background:var(--panel); border-top:1px solid var(--border); }
  #text { flex:1; }
  .expr { margin-left:6px; }
</style>
</head>
<body>
<header>
  <h1>Persona Layer</h1>
  <select id="personaSelect"></select>
  <button id="enterBtn">入室</button>
  <button id="leaveBtn">退室</button>
  <button id="ttsBtn" class="on" title="読み上げ ON/OFF">🔊</button>
  <span id="status" style="color:var(--sub)">準備中…</span>
</header>
<div id="log"></div>
<footer>
  <input id="text" placeholder="発言を入力（Enterで送信）" autocomplete="off">
  <button id="sendBtn">送信</button>
</footer>
<script>
"use strict";
const EXPR = { neutral:"😐", listening:"🙂", thinking:"🤔", speaking:"🗣️", puzzled:"😕", pleased:"😊" };
let roomId = null, ws = null, tts = true;
const instances = {};   // instanceId -> displayName
const log = document.getElementById("log");
const statusEl = document.getElementById("status");
const sel = document.getElementById("personaSelect");

function add(cls, text, who, expr) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (who) {
    const label = document.createElement("span");
    label.className = "who";
    label.textContent = who + (expr ? " " + (EXPR[expr] || "") : "");
    div.appendChild(label);
  }
  div.appendChild(document.createTextNode(text));
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function speak(ssml, text) {
  if (!tts || !("speechSynthesis" in window)) return;
  // SSML prosody（§5.3）を Web Speech API のパラメータへ写像する
  const rate = /rate="(\d+)%"/.exec(ssml);
  const pitch = /pitch="([+-]\d+)st"/.exec(ssml);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if (rate) u.rate = parseInt(rate[1], 10) / 100;
  if (pitch) u.pitch = Math.min(2, Math.max(0, 1 + parseInt(pitch[1], 10) * 0.1));
  speechSynthesis.speak(u);
}

function onEvent(e) {
  if (e.type === "enter") { instances[e.speaker_id] = e.speaker_name; add("sys", `${e.speaker_name} が入室しました`); }
  else if (e.type === "leave") { add("sys", `${e.speaker_name} が退室しました`); delete instances[e.speaker_id]; }
  else if (e.type === "turn_limit") { add("sys", "発話ターン上限に達しました（司会＝あなたの発言で再開します）"); }
  else if (e.type === "speech") {
    if (e.kind === "human") add("human", e.text, e.speaker_name);
    else if (e.kind === "task") { add("task", e.text, e.speaker_name, e.expression); speak(e.ssml || "", e.text); }
    else if (e.kind === "meta") { add("meta", e.text, `${e.speaker_name}（${e.meta_kind}）`, e.expression); speak(e.ssml || "", e.text); }
  }
}

async function init() {
  const personas = await (await fetch("/api/personas")).json();
  for (const p of personas) {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = `${p.displayName}（${p.id}）`;
    sel.appendChild(o);
  }
  roomId = (await (await fetch("/api/rooms", {method:"POST"})).json()).roomId;
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/rooms/${roomId}`);
  ws.onmessage = ev => onEvent(JSON.parse(ev.data));
  let note = "";
  try {
    const cfg = await (await fetch("/api/config")).json();
    if (cfg.agents && cfg.agents.length) note = `（回答: Agent ${cfg.agents.join("/")}）`;
    else if (cfg.usingMock) note = "（回答: ダミー）";
    else note = `（回答: ${cfg.provider}/${cfg.model}）`;
  } catch (e) { /* 設定が取れなくても動作は続ける */ }
  statusEl.textContent = personas.length ? `ルーム ${roomId} ${note}` : "人格が未登録です（serve に人格JSONを渡してください）";
}

document.getElementById("enterBtn").onclick = async () => {
  if (!sel.value) return;
  const res = await fetch(`/api/rooms/${roomId}/enter`, {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ personaId: sel.value })
  });
  if (!res.ok) add("sys", (await res.json()).detail || "入室に失敗しました");
};
document.getElementById("leaveBtn").onclick = async () => {
  const target = Object.keys(instances).find(id => id.startsWith(sel.value + "@"));
  if (!target) return;
  await fetch(`/api/rooms/${roomId}/leave`, {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ instanceId: target })
  });
};
document.getElementById("ttsBtn").onclick = (e) => {
  tts = !tts;
  e.target.classList.toggle("on", tts);
  e.target.textContent = tts ? "🔊" : "🔇";
  if (!tts) speechSynthesis.cancel();
};
async function send() {
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text || !roomId) return;
  input.value = "";
  await fetch(`/api/rooms/${roomId}/speech`, {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ text })
  });
}
document.getElementById("sendBtn").onclick = send;
document.getElementById("text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) send();
});
init();
</script>
</body>
</html>
