[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-layer"
version = "0.4.0"
description = "AI Agent インターフェース用 人格レイヤー（開発指示書 v0.4 準拠）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
persona-layer = "persona_layer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persona_layer = ["tables/*.yaml", "web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
